<!doctype html>
<html><head><meta charset="utf-8">
<!-- Product Hunt gallery, 1270×760. Render each slide with headless Chrome: gallery.html#1 … #6 (see README.md). -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1270px;height:760px;overflow:hidden}
  body{font-family:Figtree,"Segoe UI",sans-serif;color:#fff;position:relative;
    background:radial-gradient(ellipse at 75% 20%,#26324a 0%,#1b2438 45%,#111827 100%)}
  .text{position:absolute;left:80px;top:0;bottom:0;width:510px;display:flex;flex-direction:column;justify-content:center}
  .logo{display:flex;align-items:center;gap:20px;margin-bottom:36px}
  .logo img{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 2px #334155}
  .logo span{font-size:70px;font-weight:800;letter-spacing:-1px}
  h1{font-size:58px;line-height:1.06;font-weight:800;margin:0 0 22px;letter-spacing:-.5px}
  h1 em{font-style:normal;color:#fcd34d}
  p{font-size:26px;line-height:1.4;color:#cbd5e1;margin:0}
  .fine{font-size:19px;color:#94a3b8;margin-top:18px}
  .badge{align-self:flex-start;font-weight:700;font-size:20px;color:#111827;background:#fcd34d;border-radius:999px;padding:7px 18px;margin-bottom:22px}
  .tags{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
  .tags b{font-weight:500;font-size:20px;color:#fcd34d;border:2px solid #fcd34d66;border-radius:999px;padding:6px 16px}
  /* phone: raw 780×1688 app screens (docs/screenshots/src/raw) in a CSS frame */
  .phone{position:absolute;width:370px;height:820px;border-radius:52px;background:#0b0f19;
    border:3px solid #3b4559;padding:12px;box-sizing:content-box;box-shadow:0 30px 80px #000a}
  .phone img{display:block;width:370px;height:801px;object-fit:cover;object-position:top;border-radius:40px}
  .front{left:640px;top:56px;z-index:2}
  .back{left:880px;top:130px;transform:scale(.86);transform-origin:top left}
  .one{left:760px;top:64px}
  /* browser window */
  .browser{position:absolute;left:650px;top:110px;width:860px;border-radius:14px;overflow:hidden;
    background:#1f1f1f;box-shadow:0 30px 80px #000a;border:2px solid #3b4559}
  .bar{height:44px;background:#2a2f3a;display:flex;align-items:center;gap:9px;padding:0 16px}
  .bar i{width:12px;height:12px;border-radius:50%;background:#4b5563}
  .bar span{margin-left:18px;font-size:16px;color:#cbd5e1;background:#1b2130;border-radius:8px;padding:5px 16px}
  .browser img{display:block;width:860px}
  /* open-source cards */
  .cards{position:absolute;left:660px;top:120px;width:540px;display:grid;gap:16px}
  .card{background:#1e2738;border:2px solid #334155;border-radius:18px;padding:20px 24px;display:flex;gap:18px;align-items:center}
  .card b{font-size:34px;width:44px;text-align:center}
  .card div{font-size:22px;line-height:1.3;color:#e2e8f0}
  .card small{display:block;font-size:17px;color:#94a3b8;margin-top:3px}
</style></head><body>
<div id="s"></div>
<script>
const RAW='../../docs/screenshots/src/raw/', ICON='../google-play/icon-512.png';
const ph=(f,c)=>`<div class="phone ${c}"><img src="${RAW}${f}"></div>`;
const slides={
 1:`<div class="text"><div class="logo"><img src="${ICON}"><span>Tick</span></div>
    <h1>One task together, or <em>a copy for each</em></h1>
    <p>A free to-do app for the things you sort out with others.</p></div>
    ${ph('m-potluck-dark.png','back')}${ph('m-share-dark.png','front')}`,
 2:`<div class="text"><h1>Share a list, see who takes what</h1>
    <p>Tap <b>Take it</b> and the others see you're on it. Ticked-off tasks show who did it, and when.</p>
    <p class="fine">Free: share with up to 3 people, as many tasks and lists as you like.</p></div>
    ${ph('m-shared-list-dark.png','one')}`,
 3:`<div class="text"><span class="badge">Free on Android</span>
    <h1>Reminds you when you reach the shop</h1>
    <p>Give a task a place and get a nudge when you arrive or leave. Your location stays on your phone.</p>
    <p class="fine">On iPhone you get reminders at a time; place reminders need the Android app.</p></div>
    ${ph('m-driving-dark.png','back')}${ph('m-location-dark.png','front')}`,
 4:`<div class="text"><h1>On your phone and in&nbsp;your browser</h1>
    <p>Android app, any browser, and iPhone from the home screen. Works offline too.</p>
    <div class="tags"><b>Web</b><b>Android</b><b>iPhone</b><b>Offline</b></div></div>
    <div class="browser"><div class="bar"><i></i><i></i><i></i><span>app.ticktodo.nl</span></div>
    <img src="${RAW}d-all-dark.png"></div>`,
 5:`<div class="text"><h1>Old tasks get a second chance</h1>
    <p>The Tickmanager brings forgotten tasks back one at a time: schedule, move to top, leave it, or delete.</p></div>
    ${ph('m-manager-dark.png','one')}`,
 6:`<div class="text"><h1>Open source. <em>Host your own.</em></h1>
    <p>No ads, no tracking. The code is on GitHub, so you can see what Tick does, or run it yourself.</p></div>
    <div class="cards">
     <div class="card"><b>☁️</b><div>Runs on a free Cloudflare account<small>Your Tick, your data, no limit on people</small></div></div>
     <div class="card"><b>⚡</b><div>Set up in about 15 minutes<small>Claude Code does the steps for you</small></div></div>
     <div class="card"><b>🤖</b><div>Let Claude manage your tasks<small>Built-in MCP server, with a key you can revoke</small></div></div>
     <div class="card"><b>📖</b><div>MIT licence<small>github.com/DioVayne/tick</small></div></div>
    </div>`
};
document.getElementById('s').innerHTML=slides[location.hash.slice(1)||1];
</script></body></html>
