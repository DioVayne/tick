<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tick</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tick">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu" class="ghost" data-i18n-attr="aria-label:ui.menu" aria-label="Menu" aria-controls="side" aria-expanded="false">☰</button>
      <h1><button id="title" class="titlebtn" type="button" aria-haspopup="menu" disabled data-i18n="ui.all">All</button></h1>
      <input id="search" class="search" type="search" data-i18n-attr="placeholder:ui.search_placeholder;aria-label:ui.search" placeholder="Search…" aria-label="Search" autocomplete="off" enterkeyhint="search" hidden>
      <button id="btn-search" class="iconbtn" type="button" data-i18n-attr="aria-label:ui.search;title:ui.search_title" aria-label="Search" title="Search ( / )" aria-controls="search" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </header>
    <aside id="side" data-i18n-attr="aria-label:ui.lists" aria-label="Lists">
      <h2 class="brand">Tick</h2>
      <nav id="side-lists"></nav>
      <div id="side-new">
        <button id="btn-newlist" class="item muted" type="button" data-i18n="ui.new_list_button">+ New list</button>
        <input id="newlist-input" class="newlist" data-i18n-attr="placeholder:ui.list_name;aria-label:ui.new_list_name" placeholder="List name" aria-label="Name of the new list" maxlength="100" autocomplete="off" hidden>
      </div>
      <div class="side-grp side-more">
        <button id="btn-calendar" class="item" type="button" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg><span class="name" data-i18n="cal.open">Calendar</span></button>
        <button id="btn-done" class="item" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8.5 12.5l2.5 2.5 5-5"/></svg><span class="name" data-i18n="ui.completed">Completed</span></button>
        <button id="btn-trash" class="item" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span class="name" data-i18n="ui.trash">Trash</span></button>
      </div>
      <div class="side-foot">
        <button id="btn-settings" class="item" type="button" data-i18n="set.open">⚙ Settings</button>
      </div>
    </aside>
    <div class="scrim"></div>
    <main id="main">
      <p id="net" class="net" role="status" hidden></p>
      <form id="add" autocomplete="off">
        <input id="add-title" data-i18n-attr="placeholder:ui.new_task_placeholder;aria-label:ui.new_task" placeholder="New task…" aria-label="New task" maxlength="500" enterkeyhint="done" autocomplete="off" required>
        <kbd class="add-key" aria-hidden="true">N</kbd>
        <input id="add-remind" type="hidden">
        <button id="add-when" type="button" aria-haspopup="dialog" data-i18n-attr="aria-label:ui.reminder;title:ui.reminder" aria-label="Reminder" title="Reminder">🔔</button>
        <button type="submit" data-i18n="ui.add">Add</button>
        <button id="add-open" type="button" class="ghost" data-i18n="ui.add_details" data-i18n-attr="title:ui.add_details_title" title="Add and open the details (Shift+Enter)">Details</button>
      </form>
      <div id="list" aria-live="polite"></div>
      <p id="status" class="status" role="status"></p>
    </main>
    <div id="resizer" aria-hidden="true"></div>
    <section id="detail" data-i18n-attr="aria-label:ui.task" aria-label="Task"><p class="detail-empty" data-i18n="ui.pick_task">Pick a task</p></section>
  </div>
  <script src="/sortable.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
