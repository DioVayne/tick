<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tick</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tick">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu" class="ghost" data-i18n-attr="aria-label:ui.menu" aria-label="Menu" aria-controls="side" aria-expanded="false">☰</button>
      <h1 id="title" data-i18n="ui.all">All</h1>
    </header>
    <aside id="side" data-i18n-attr="aria-label:ui.lists" aria-label="Lists">
      <h2 class="brand">Tick</h2>
      <nav id="side-lists"></nav>
      <div id="side-new">
        <button id="btn-newlist" class="item muted" type="button" data-i18n="ui.new_list_button">+ New list</button>
        <input id="newlist-input" class="newlist" data-i18n-attr="placeholder:ui.list_name;aria-label:ui.new_list_name" placeholder="List name" aria-label="Name of the new list" maxlength="100" autocomplete="off" hidden>
      </div>
      <div class="sep"></div>
      <button id="btn-done" class="item" aria-pressed="false"><span class="name" data-i18n="ui.completed">Completed</span></button>
      <button id="btn-trash" class="item" aria-pressed="false"><span class="name" data-i18n="ui.trash">Trash</span></button>
      <div class="side-foot">
        <button id="btn-settings" class="item" type="button" data-i18n="set.open">⚙ Settings</button>
      </div>
    </aside>
    <div class="scrim"></div>
    <main id="main">
      <p id="net" class="net" role="status" hidden></p>
      <input id="search" class="search" type="search" data-i18n-attr="placeholder:ui.search_placeholder;aria-label:ui.search" placeholder="Search…  ( / )" aria-label="Search" autocomplete="off" enterkeyhint="search">
      <form id="add" autocomplete="off">
        <input id="add-title" data-i18n-attr="placeholder:ui.new_task_placeholder;aria-label:ui.new_task" placeholder="New task…" aria-label="New task" required>
        <input id="add-remind" type="datetime-local" data-i18n-attr="aria-label:ui.reminder;title:ui.reminder" aria-label="Reminder" title="Reminder">
        <button type="submit" data-i18n="ui.add">Add</button>
      </form>
      <div id="list" aria-live="polite"></div>
      <p id="status" class="status" role="status"></p>
    </main>
    <div id="resizer" aria-hidden="true"></div>
    <section id="detail" data-i18n-attr="aria-label:ui.task" aria-label="Task"><p class="detail-empty" data-i18n="ui.pick_task">Pick a task</p></section>
  </div>
  <script src="/sortable.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
