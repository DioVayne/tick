<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beheer · ticktodo.nl</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/beheer/beheer.css">
<script src="/beheer/login.js" defer></script>
</head>
<body>
<main>
<h1>Beheer</h1>
<p>Log in om de teksten op ticktodo.nl aan te passen.</p>
<form id="login">
<label for="wachtwoord">Wachtwoord</label>
<input type="password" id="wachtwoord" autocomplete="current-password" required autofocus>
<button type="submit" id="knop">Inloggen</button>
<p id="melding" role="status" aria-live="polite"></p>
</form>
</main>
</body>
</html>
