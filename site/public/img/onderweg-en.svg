<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1039" width="480" height="1039" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Drawing of an Android lock screen with Tick's "almost at" notification (Notify.java, loc_almost), on a bike. -->
  <rect width="480" height="1039" fill="#1e293b"/>

  <!-- wallpaper: a road, the place with its circle and the bigger on-the-road circle, a cyclist at its edge -->
  <g fill="#243248">
    <rect x="20" y="600" width="130" height="110" rx="12"/>
    <rect x="370" y="610" width="96" height="120" rx="12"/>
    <rect x="30" y="860" width="160" height="70" rx="12"/>
    <rect x="380" y="860" width="90" height="70" rx="12"/>
  </g>
  <rect x="0" y="790" width="480" height="44" fill="#2b3a52"/>
  <path d="M0 812H480" stroke="#475569" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="320" cy="760" r="170" fill="#fcd34d" fill-opacity=".08" stroke="#fcd34d" stroke-width="2.5" stroke-dasharray="8 8"/>
  <circle cx="320" cy="760" r="78" fill="#fcd34d" fill-opacity=".22" stroke="#e0a800" stroke-width="2.5"/>
  <g transform="translate(320 745) scale(0.11) translate(-256 -260)">
    <g transform="translate(256 260) scale(1.5) translate(-256 -260)"><path d="M256 104C184 104 132 158 132 226C132 312 256 416 256 416C256 416 380 312 380 226C380 158 328 104 256 104Z" fill="#fcd34d" stroke="#1e293b" stroke-width="16" stroke-linejoin="round"/><path d="M200 228l40 40 76-86" fill="none" stroke="#1e293b" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- cyclist -->
  <g transform="translate(156 806)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-15" cy="0" r="11" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="17" cy="0" r="11" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M-15 0l9-17h18l5 17M-6 -17l7 17h16M12 -17l-2-6h-5" stroke="#e2e8f0" stroke-width="3"/>
    <path d="M1 0l-1-16 6-14" stroke="#ea580c" stroke-width="4.5"/>
    <path d="M6 -30l9 9" stroke="#ea580c" stroke-width="4"/>
    <circle cx="5" cy="-38" r="5.5" fill="#ea580c" stroke="none"/>
  </g>

  <!-- status bar and lock -->
  <g fill="#e2e8f0">
    <path d="M372 36l20-20v20z"/>
    <path d="M402 24a16 16 0 0 1 22 0l-11 13z"/>
    <rect x="432" y="20" width="24" height="14" rx="3" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="435" y="23" width="15" height="8" rx="1"/>
    <rect x="457" y="24" width="3" height="6" rx="1"/>
  </g>
  <rect x="230" y="78" width="20" height="15" rx="3" fill="#e2e8f0"/>
  <path d="M234 78v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- clock -->
  <text x="240" y="222" text-anchor="middle" font-size="110" font-weight="300" fill="#ffffff">9:41</text>
  <text x="240" y="264" text-anchor="middle" font-size="22" fill="#cbd5e1">Tuesday 3 November</text>

  <!-- the notification -->
  <rect x="20" y="304" width="440" height="222" rx="28" fill="#0f172a" fill-opacity=".35"/>
  <rect x="20" y="300" width="440" height="222" rx="28" fill="#ffffff"/>
  <circle cx="62" cy="344" r="22" fill="#e2e8f0"/>
  <g transform="translate(50 332)"><path fill="#1e293b" d="M12,2C8.13,2 5,5.13 5,9c0,5.25 7,13 7,13s7,-7.75 7,-13c0,-3.87 -3.13,-7 -7,-7zM12,11.5c-1.38,0 -2.5,-1.12 -2.5,-2.5s1.12,-2.5 2.5,-2.5 2.5,1.12 2.5,2.5 -1.12,2.5 -2.5,2.5z"/></g>
  <text x="98" y="338" font-size="18" fill="#64748b">Tick · now</text>
  <path d="M418 330l8 8 8-8" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="374" font-size="24" font-weight="700" fill="#1b1f24">Buy groceries</text>
  <!-- the 📍 from the text, drawn -->
  <g transform="translate(98 388)">
    <path d="M8 9l-6 13" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="10" cy="7" r="7" fill="#dc2626"/>
    <circle cx="8" cy="5" r="2" fill="#fca5a5"/>
  </g>
  <text font-size="22" fill="#475569"><tspan x="124" y="408">Almost at Albert Heijn</tspan><tspan x="98" y="438">Westerstraat</tspan></text>
  <rect x="88" y="462" width="124" height="40" rx="20" fill="#e8effd"/>
  <text x="150" y="489" text-anchor="middle" font-size="20" font-weight="600" fill="#1f6feb">Complete</text>

  <!-- shortcuts and handle -->
  <circle cx="72" cy="960" r="32" fill="#334155"/>
  <path d="M66 944h12l-2 8v18h-8v-18z" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="408" cy="960" r="32" fill="#334155"/>
  <rect x="392" y="950" width="32" height="22" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <circle cx="408" cy="961" r="6" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
  <path d="M401 950l3-5h8l3 5" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="180" y="1016" width="120" height="6" rx="3" fill="#e2e8f0"/>
</svg>
