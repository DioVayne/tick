<!doctype html>
<!-- Source of social-preview.png (GitHub social preview, 1280x640, rendered at 2x).
     Render: msedge --headless --screenshot=social-preview.png --window-size=1280,640 --force-device-scale-factor=2 social-preview.html
     (or with Playwright at deviceScaleFactor 2; the committed PNG is compressed to a palette PNG with sharp, see screenshots/src).
     Logo, name and promise stay inside the middle 1040x520, because some sites crop the edges. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #f1f5f9;
    background:
      radial-gradient(circle at 80% 45%, #3b4a63 0, transparent 52%),
      radial-gradient(circle at 10% 100%, #24324a 0, transparent 45%),
      #1e293b;
  }

  .text { position: absolute; left: 128px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 92px; height: 92px; border-radius: 21px; box-shadow: 0 0 0 1px #475569, 0 10px 30px rgb(0 0 0 / .4); }
  h1 { font-size: 88px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .tag { font-size: 30px; line-height: 1.25; color: #e2e8f0; margin-top: 26px; font-weight: 600; }
  .tag span { color: #fcd34d; }

  ul { list-style: none; padding: 0; margin-top: 30px; display: grid; gap: 12px; }
  li { display: flex; align-items: center; gap: 14px; font-size: 23px; color: #e2e8f0; }
  li b { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: #334155;
    font-size: 21px; box-shadow: inset 0 0 0 1px #475569; }

  .small { margin-top: 30px; font-size: 18px; color: #94a3b8; letter-spacing: .2px; }

  /* Phones like in the README: dark frame, notch, status bar, rounded screen */
  .phone { position: absolute; width: 214px; aspect-ratio: 390 / 844; background: #0d0f14; border-radius: 34px; padding: 7.5px;
    box-shadow: inset 0 0 0 1.5px #4b5563, 0 28px 60px rgb(0 0 0 / .55); }
  .phone .scr { width: 100%; height: 100%; border-radius: 27px; overflow: hidden; background: #fff; }
  .phone .bar { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
    font: 600 10px/1 "Segoe UI", system-ui, sans-serif; color: #111; }
  .phone .bar i { width: 13px; height: 7px; border: 1.5px solid currentColor; border-radius: 2px; }
  .phone img { display: block; width: 100%; }
  .phone::after { content: ""; position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 56px; height: 12px;
    background: #0d0f14; border-radius: 99px; }
  .back-l { left: 742px; top: 128px; rotate: -6deg; filter: brightness(.8); }
  .back-r { left: 1010px; top: 128px; rotate: 6deg; filter: brightness(.8); }
  .front { left: 862px; top: 84px; width: 236px; border-radius: 37px; z-index: 1; }
  .front .scr { border-radius: 30px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="logo.svg" alt=""><h1>Tick</h1></div>
    <p class="tag">Your own free to-do app,<br>with reminders that <span>know where you are</span>.</p>
    <ul>
      <li><b>📍</b>Reminders on arrival or on leaving</li>
      <li><b>👥</b>Shared lists for your household</li>
      <li><b>⚡</b>Old tasks get a second chance</li>
    </ul>
    <p class="small">Free · Web + Android · on your own Cloudflare account</p>
  </div>
  <div class="phone back-l"><div class="scr"><div class="bar"><span>16:20</span><i></i></div><img src="screenshots/src/raw/m-shared-list-light.png" alt=""></div></div>
  <div class="phone back-r"><div class="scr"><div class="bar"><span>16:20</span><i></i></div><img src="screenshots/src/raw/m-home-light.png" alt=""></div></div>
  <div class="phone front"><div class="scr"><div class="bar"><span>16:20</span><i></i></div><img src="screenshots/src/raw/m-location-light.png" alt=""></div></div>
</body>
</html>
