plugins {
    id 'com.android.application'
}

// Instellingen van je eigen build: -PtickBase=... -PtickPackage=... of dezelfde sleutels in android/tick.properties
// (niet in git). tickBase is het adres van je Tick; tickPackage het unieke applicationId van je app.
def tickProps = new Properties()
def tickFile = rootProject.file('tick.properties')
if (tickFile.exists()) tickFile.withInputStream { tickProps.load(it) }
def tickSetting = { String key -> project.findProperty(key) ?: tickProps.getProperty(key) }
def tickBase = tickSetting('tickBase')
if (!tickBase) throw new GradleException('Set the address of your Tick: -PtickBase=https://your-tick.example or tickBase=... in android/tick.properties')
def tickHost = new URI(tickBase).host
def tickScheme = new URI(tickBase).scheme

// Release-ondertekening, ook uit tick.properties (de keystore zelf hoort niet in git). Zonder deze vier werkt
// assembleDebug gewoon en weigert assembleRelease met de melding hieronder.
def signingKeys = ['tickKeystore', 'tickKeystorePassword', 'tickKeyAlias', 'tickKeyPassword']
def hasSigning = signingKeys.every { tickSetting(it) }

android {
    namespace 'nl.detussenpartij.tick'
    compileSdk 36

    defaultConfig {
        // De Java-namespace blijft nl.detussenpartij.tick; alleen het applicationId moet uniek zijn.
        applicationId tickSetting('tickPackage') ?: 'com.example.tick'
        minSdk 31
        targetSdk 36
        versionCode 7
        versionName '1.4.2'
        // Adres van de API; voor testen op de emulator: -PtickBase=http://localhost:8787 (met adb reverse)
        buildConfigField 'String', 'TICK_BASE', "\"${tickBase}\""
        manifestPlaceholders = [tickHost: tickHost, tickScheme: tickScheme, tickBase: tickBase]
        // Digital Asset Links vanuit de app; de site verwijst terug via /.well-known/assetlinks.json
        resValue 'string', 'asset_statements',
            '[{\\"relation\\":[\\"delegate_permission/common.handle_all_urls\\"],' +
            '\\"target\\":{\\"namespace\\":\\"web\\",\\"site\\":\\"' + tickBase + '\\"}}]'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(tickSetting('tickKeystore'))
                storePassword tickSetting('tickKeystorePassword')
                keyAlias tickSetting('tickKeyAlias')
                keyPassword tickSetting('tickKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zonder sleutels geen (ongetekende) release: die kun je niet installeren en past niet bij ANDROID_CERT_SHA256.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!hasSigning) throw new GradleException('Set tickKeystore, tickKeystorePassword, tickKeyAlias and tickKeyPassword in android/tick.properties to build a release')
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
