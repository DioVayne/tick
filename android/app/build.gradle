plugins {
    id 'com.android.application'
}

// Instellingen van je build: -PtickBase=... -PtickPackage=... of dezelfde sleutels in android/tick.properties (niet in
// git). Beide zijn optioneel. Zonder tickBase is het de algemene app: die vraagt het adres van je Tick bij de eerste
// start (of krijgt het uit de koppellink). Met tickBase begint de app met dat adres. tickPackage is het unieke
// applicationId; de officiële app (GitHub Releases) is nl.detussenpartij.tick, met de release-sleutel van het project.
def tickProps = new Properties()
def tickFile = rootProject.file('tick.properties')
if (tickFile.exists()) tickFile.withInputStream { tickProps.load(it) }
def tickSetting = { String key -> project.findProperty(key) ?: tickProps.getProperty(key) }
def tickBase = (tickSetting('tickBase') ?: '').trim().replaceAll('/+$', '')
if (tickBase && !(tickBase ==~ /^https?:\/\/[^\/?#]+$/)) throw new GradleException('tickBase must look like https://your-tick.example (no path)')
// Een eigen build opent alleen links naar zijn eigen host; de algemene app kent die nog niet (zie het manifest).
def tickHost = tickBase ? new URI(tickBase).host : '*'
def tickScheme = tickBase ? new URI(tickBase).scheme : 'https'

// Release-ondertekening, ook uit tick.properties (de keystore zelf hoort niet in git). Zonder deze vier werkt
// assembleDebug gewoon en weigert assembleRelease met de melding hieronder.
def signingKeys = ['tickKeystore', 'tickKeystorePassword', 'tickKeyAlias', 'tickKeyPassword']
def hasSigning = signingKeys.every { tickSetting(it) }

android {
    namespace 'nl.detussenpartij.tick'
    compileSdk 36

    defaultConfig {
        // De Java-namespace blijft nl.detussenpartij.tick; alleen het applicationId moet uniek zijn.
        applicationId tickSetting('tickPackage') ?: 'com.example.tick'
        minSdk 31
        targetSdk 36
        versionCode 19
        versionName '1.9.0'
        // Beginadres (leeg in de algemene app); voor testen op de emulator: -PtickBase=http://localhost:8787 (met adb reverse)
        buildConfigField 'String', 'TICK_BASE', "\"${tickBase}\""
        manifestPlaceholders = [tickHost: tickHost, tickScheme: tickScheme]
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(tickSetting('tickKeystore'))
                storePassword tickSetting('tickKeystorePassword')
                keyAlias tickSetting('tickKeyAlias')
                keyPassword tickSetting('tickKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zonder sleutels geen (ongetekende) release: die kun je niet installeren en past niet bij ANDROID_CERT_SHA256.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!hasSigning) throw new GradleException('Set tickKeystore, tickKeystorePassword, tickKeyAlias and tickKeyPassword in android/tick.properties to build a release')
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
